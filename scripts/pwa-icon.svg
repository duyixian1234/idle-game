<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- PWA 应用图标：深空终端风。背景 #050505 + 磷光绿 #33ff00 星环钻头（与游戏主题 phosphor 变量一致） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f0c"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <!-- 背景（maskable 安全区：符号主体集中于中心 80% 内） -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="25" fill="none" stroke="#1d3320" stroke-width="2"/>
  <!-- 星环轨道（倾斜双环，呼应"深空拓荒"） -->
  <ellipse cx="64" cy="64" rx="45" ry="17" fill="none" stroke="#33ff00" stroke-width="3" transform="rotate(-22 64 64)" opacity="0.9"/>
  <ellipse cx="64" cy="64" rx="33" ry="12" fill="none" stroke="#2f6b2f" stroke-width="2.5" transform="rotate(-22 64 64)" opacity="0.8"/>
  <!-- 中心采矿钻头（沿用游戏内 miner 图标符号放大版） -->
  <path d="M64 26l16 27.5L64 106 48 53.5z" fill="#33ff00"/>
  <path d="M42 53.5h44" stroke="#050505" stroke-width="4"/>
  <circle cx="64" cy="84" r="5" fill="#050505"/>
  <!-- 轨道卫星点（终端 ASCII 点缀） -->
  <circle cx="34" cy="52" r="3" fill="#9cb39c"/>
  <circle cx="94" cy="72" r="2.5" fill="#9cb39c" opacity="0.7"/>
</svg>
